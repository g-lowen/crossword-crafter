<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crossword Crafter</title>
    <script>
      // Apply a chosen light or dark theme before the page draws, so it doesn't flash.
      try {
        var theme = localStorage.getItem('crossword-crafter/theme')
        if (theme === 'light' || theme === 'dark' || theme === 'gg') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
